name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.9"
            build: false
            artifact-name: ""
          - os: ubuntu-latest
            python-version: "3.10"
            build: false
            artifact-name: ""
          - os: ubuntu-latest
            python-version: "3.11"
            build: false
            artifact-name: ""
          - os: ubuntu-latest
            python-version: "3.12"
            build: true
            artifact-name: "wizctl-linux-x86_64"
          - os: macos-latest
            python-version: "3.12"
            build: true
            artifact-name: "wizctl-macos"
          - os: windows-latest
            python-version: "3.12"
            build: true
            artifact-name: "wizctl-windows"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest -v

      - name: Compile source
        run: python -m compileall -q src

      - name: Build Python distributions (Wheel & Sdist)
        if: matrix.build && matrix.os == 'ubuntu-latest'
        run: python -m build

      - name: Upload Python distribution artifacts
        if: matrix.build && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: wizctl-python-dist
          path: dist/*.whl

      - name: Build standalone executable (Linux / macOS)
        if: matrix.build && matrix.os != 'windows-latest'
        run: |
          python -m PyInstaller --onefile --clean --name wizctl --collect-all tkinterdnd2 --paths src src/wizctl/__main__.py
          ./dist/wizctl --help
          ./dist/wizctl scenes

      - name: Build standalone executable (Windows)
        if: matrix.build && matrix.os == 'windows-latest'
        run: |
          python -m PyInstaller --onefile --clean --name wizctl --collect-all tkinterdnd2 --paths src src/wizctl/__main__.py
          .\dist\wizctl.exe --help
          .\dist\wizctl.exe scenes

      - name: Upload standalone binary executable
        if: matrix.build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            dist/wizctl
            dist/wizctl.exe
