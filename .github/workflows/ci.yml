name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.9"
            build: false
          - os: ubuntu-latest
            python-version: "3.10"
            build: false
          - os: ubuntu-latest
            python-version: "3.11"
            build: false
          - os: ubuntu-latest
            python-version: "3.12"
            build: true
          - os: macos-latest
            python-version: "3.12"
            build: true
          - os: windows-latest
            python-version: "3.12"
            build: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest -v

      - name: Compile source
        run: python -m compileall -q src

      - name: Build Python distributions
        if: matrix.build
        run: python -m build

      - name: Build standalone executable
        if: matrix.build
        run: python -m PyInstaller --onefile --clean --name wizctl --paths src src/wizctl/__main__.py
